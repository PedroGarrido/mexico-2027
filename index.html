async function commitMutation(mutate,message='Cambios guardados'){if(!canEdit()){toast('Necesitas permiso para editar los datos compartidos.');return false;}const next=clone(db);mutate(next);next.updated=new Date().toISOString().slice(0,10);if(!cloud.state.configured){db=next;saveLocal();render();toast(message);return true}try{await cloud.save(next);db=clone(next);render();toast(message);return true}catch(err){try{await cloud.loadRemote()}catch(_){}db=clone(cloud.state.data||STARTER);render();alert('No se pudo guardar: '+cloud.explain(err));return false}}
function e(s){return String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function safeUrl(url){return /^https:\/\//i.test(String(url||''))?e(url):'#'}
function dateFmt(s,{month='short',day='numeric',weekday}={}){if(!s)return 'Sin fecha';const d=new Date(s+'T12:00:00Z');if(Number.isNaN(d.getTime()))return e(s);return new Intl.DateTimeFormat('es-ES',{day,month, ...(weekday?{weekday} :{}),timeZone:'UTC'}).format(d)}
function eur(n){return new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:2}).format(Number(n)||0)}
function tag(text){return `<span class="status ${e(String(text).toLowerCase().replace(/\s+/g,'-'))}">${e(text)}</span>`}
function navGo(next){if(!NAV.some(n=>n[0]===next))next='inicio';active=next;filter.search='';history.replaceState(null,'','#'+next);$('#sidebar').classList.remove('open');$('#mobileShade').classList.remove('show');render();window.scrollTo({top:0,behavior:'instant'});}
function renderNav(){const pending=db.tasks.filter(t=>t.status!=='Hecho').length;$('#sidebarNav').innerHTML=NAV.filter(([id])=>!HIDDEN_NAV_IDS.has(id)).map(([id,icon,title])=>`<button class="nav-item ${active===id?'active':''}" data-nav="${id}"><span class="nicon">${icon}</span><span>${title}</span>${id==='pendientes'?`<span class="nav-count">${pending}</span>`:''}</button>`).join('');$('#crumbSection').textContent=NAV.find(n=>n[0]===active)?.[2]||'Inicio';const days=Math.ceil((new Date('2027-02-20T00:00:00')-new Date())/86400000);$('#countdownSide').textContent=days>0?days+' días':days===0?'¡Hoy!':'En marcha';}
function pagehead(eyebrow,title,sub,button=''){return `<header class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${sub}</p></div>${button}</header>`}
function sectionTitle(t,other=''){return `<div class="section-title"><h2>${t}</h2>${other}</div>`}
function buttonAdd(type,label='Añadir'){if(!canEdit())return '';return `<button class="btn btn-primary" data-action="edit" data-type="${type}">＋ ${label}</button>`}
function actions(type,id){if(!canEdit())return '';return `<button class="iconbtn" data-action="edit" data-type="${type}" data-id="${e(id)}" title="Editar" aria-label="Editar">✎</button>`}
function showInicio(){const activeTasks=db.tasks.filter(t=>t.status!=='Hecho');const complete=db.tasks.length-activeTasks.length;const completedPercent=db.tasks.length?Math.round(100*complete/db.tasks.length):0;const groupBudget=db.budget.filter(b=>b.scope==='Grupo').reduce((sum,b)=>sum+b.quantity*b.unitPrice,0);const pBudget=db.budget.filter(b=>b.scope==='Pareja').reduce((sum,b)=>sum+b.quantity*b.unitPrice,0);const important=activeTasks.filter(t=>t.priority==='Alta').slice(0,5);const route=[['01','Monterrey','Antes del 20 feb.'],['02','CDMX','20–24 feb.'],['03','Mérida','25–26 feb.'],['04','Boda / Calakmul','26–28 feb.'],['05','Caribe','1–5 mar.']];return `

<div class="stat-grid"><div class="panel stat"><span class="stat-symbol">🗓️</span><div class="s-label">Tramo en grupo</div><div class="value">14 días</div><div class="sub">20 feb — 5 mar 2027</div></div><div class="panel stat"><span class="stat-symbol">👥</span><div class="s-label">Viajeros previstos</div><div class="value">6</div><div class="sub">+ contactos locales</div></div><div class="panel stat"><span class="stat-symbol">☑️</span><div class="s-label">Pendientes abiertos</div><div class="value">${activeTasks.length}</div><div class="sub">${completedPercent}% de tareas completadas</div></div><div class="panel stat"><span class="stat-symbol">🎈</span><div class="s-label">Actividades estudiadas</div><div class="value">3</div><div class="sub">Globo, Río Secreto y carnet</div></div></div>

<div class="panel panel-body"><div class="route-list">${route.map((r,i)=>`${i?'<span class="route-arrow">›</span>':''}<div class="route-stop"><div class="stop-num">ETAPA ${r[0]}</div><b>${r[1]}</b><small>${r[2]}</small></div>`).join('')}</div><div class="mini-alert" style="margin-top:15px"><b>⚠️ Punto clave:</b> el tramo entre el <b>26 de febrero y el 5 de marzo</b> continúa en revisión. La salida temprana a Calakmul afecta a Uxmal y al reencuentro del grupo, y puede cambiar las noches en Holbox y el orden de Chichén Itzá.</div></div>
<div class="grid-two" style="grid-template-columns:1fr"> <div>${sectionTitle('Lo más urgente','<button class="btn btn-outline btn-small" data-nav="pendientes">Todos los pendientes →</button>')}<div class="panel panel-body">${important.length?important.map(t=>`<div class="taskline"><input class="tick" type="checkbox" aria-label="Completar ${e(t.title)}" data-action="quick-task" data-id="${e(t.id)}"/><div style="flex:1"><b>${e(t.title)}</b><small>${e(t.detail)}</small></div>${tag(t.priority)}</div>`).join(''):'<div class="empty">¡No hay tareas prioritarias pendientes!</div>'}<button class="btn btn-soft btn-small" style="margin-top:12px" data-action="edit" data-type="tasks">＋ Nuevo pendiente</button></div></div><div hidden>${sectionTitle('Cifras orientativas')}<div class="panel panel-body"><div class="little-label">ACTIVIDADES PARA LOS 6</div><div style="font-size:30px;font-weight:850;letter-spacing:-1px;margin:4px 0">${eur(groupBudget)}</div><div class="muted" style="font-size:11px;margin-bottom:15px">Globo + Río Secreto; estimación grupal, no pagado</div><div class="separator"></div><div class="little-label">COSTES DE PAREJA ANOTADOS APARTE</div><div style="font-size:26px;font-weight:800;letter-spacing:-.7px;margin:4px 0">${eur(pBudget)}</div><div class="muted" style="font-size:11px">Actualmente solo los permisos internacionales. No sumar ambos bloques como presupuesto completo.</div><button class="btn btn-outline btn-small" style="margin-top:15px" data-nav="presupuesto">Abrir presupuesto →</button></div></div></div>

`}
function showItinerario(){const arr=[...db.itinerary].sort((a,b)=>(a.date||'').localeCompare(b.date||'')||a.id.localeCompare(b.id));const regs=['Todas',...new Set(db.itinerary.map(d=>d.region))];const groups=['Todos los grupos','Todos','Laura y Peri','Amigos'];const data=arr.filter(x=>(filter.itineraryRegion==='Todas'||x.region===filter.itineraryRegion)&&(filter.itineraryGroup==='Todos los grupos'||x.group===filter.itineraryGroup));const emojis={'Monterrey':'🏙️','CDMX':'🏛️','Yucatán':'🌿','Calakmul':'🐒','Caribe':'🌊'};return `${pagehead('EL VIAJE DÍA A DÍA','Itinerario completo','Plan original y cambios que hemos hablado. Cada tarjeta se puede modificar; ninguna propuesta equivale a una reserva.',buttonAdd('itinerary','Añadir plan'))}<div class="filterrow"><select data-filter="itineraryRegion" aria-label="Filtrar por zona">${regs.map(o=>`<option ${filter.itineraryRegion===o?'selected':''}>${e(o)}</option>`).join('')}</select><select data-filter="itineraryGroup" aria-label="Filtrar por grupo">${groups.map(o=>`<option ${filter.itineraryGroup===o?'selected':''}>${e(o)}</option>`).join('')}</select><span class="count-pill">${data.length} planes</span></div><div class="timeline">${data.map(d=>`<div class="timeline-item"><div class="timeline-date"><b>${e(d.dateLabel||dateFmt(d.date,{weekday:'short',month:'short'}))}</b>${d.dateLabel?'':`<small>${d.date.slice(0,4)}</small>`}</div><article class="timeline-card"><div class="place-icon">${emojis[d.region]||'📍'}</div><div style="flex:1;min-width:0"><div class="meta">${e(d.place)} · ${e(d.group)}</div><h3>${e(d.title)}</h3><p>${e(d.description)}</p>${d.note?`<div class="note">↳ ${e(d.note)}</div>`:''}</div><div class="actions">${tag(d.status)}${actions('itinerary',d.id)}</div></article></div>`).join('')}</div>${!data.length?'<div class="empty">No hay planes con estos filtros.</div>':''}`}
function showActividades(){const vals=['Todas','Investigado','Previsto','En revisión','Por definir','Por decidir','Por investigar'];const filtered=db.activities.filter(a=>filter.activity==='Todas'||a.status===filter.activity);return `${pagehead('EXCURSIONES Y EXPERIENCIAS','Actividades','Comparativas, precios investigados y planes pendientes. Los importes son orientativos, no tarifas reservadas.',buttonAdd('activities','Añadir actividad'))}<div class="filterrow"><select data-filter="activity" aria-label="Filtrar actividades">${vals.map(v=>`<option ${filter.activity===v?'selected':''}>${v}</option>`).join('')}</select><span class="count-pill">${filtered.length} actividades</span></div><div class="catalog">${filtered.map(a=>`<article class="panel activity"><div class="activity-top"><div class="activity-head"><div class="activity-emoji">${e(a.emoji||'🎟️')}</div><div style="flex:1;min-width:0"><h3>${e(a.title)}</h3><div class="muted" style="font-size:11px">${e(a.location)} · ${dateFmt(a.date)}</div></div>${tag(a.status)}</div><p class="desc">${e(a.description)}</p>${a.details?`<div class="muted" style="font-size:11px;line-height:1.6">${e(a.details)}</div>`:''}</div>${a.packages?.length?`<div class="packages"><details><summary>Ver ${a.packages.length} opciones y precios ▾</summary>${a.packages.map(p=>`<div class="package-row"><span>${e(p[0])}</span><strong>${eur(p[1])}</strong></div>`).join('')}<div class="muted" style="font-size:10px;padding-top:6px">Ofertas orientativas de noviembre de 2026, sin disponibilidad para 2027 confirmada.</div></details></div>`:''}<div class="activity-bottom"><div>${a.price!==null&&a.price!==undefined?`<span class="price">${eur(a.price)}<small> / persona desde</small></span>`:'<span class="muted" style="font-size:12px">Precio por investigar</span>'}</div><div style="display:flex;gap:7px">${a.url?`<a href="${safeUrl(a.url)}" target="_blank" rel="noopener noreferrer" class="btn btn-outline btn-small">Web oficial ↗</a>`:''}${actions('activities',a.id)}</div></div></article>`).join('')}</div>${!filtered.length?'<div class="empty">No hay actividades con este filtro.</div>':''}`}
function showPresupuesto(){const group=db.budget.filter(b=>b.scope==='Grupo').reduce((s,b)=>s+Number(b.unitPrice)*Number(b.quantity),0);const pair=db.budget.filter(b=>b.scope==='Pareja').reduce((s,b)=>s+Number(b.unitPrice)*Number(b.quantity),0);const paid=db.budget.filter(b=>b.status==='Pagado').reduce((s,b)=>s+Number(b.unitPrice)*Number(b.quantity),0);return `${pagehead('COSTES Y PREVISIONES','Presupuesto','Añade gastos y compara estimaciones. Los totales del grupo y los de la pareja son categorías distintas.',buttonAdd('budget','Añadir gasto'))}<div class="budget-summary"><div class="panel budget-stat"><div class="little-label">PARA EL GRUPO</div><b>${eur(group)}</b><small>Suma de partidas grupales anotadas</small></div><div class="panel budget-stat"><div class="little-label">PARA LA PAREJA</div><b>${eur(pair)}</b><small>Partidas propias, no incluye parte grupal</small></div><div class="panel budget-stat"><div class="little-label">MARCADO COMO PAGADO</div><b>${eur(paid)}</b><small>De las partidas registradas</small></div></div><div class="callout"><b>Sobre los precios:</b> globo (~172 € por persona) y Río Secreto Clásico (~81 € por persona) son referencias de noviembre de 2026; las reservas todavía no se han realizado. No se han incluido vuelos, alojamientos, la mayoría de excursiones ni alquiler de coche. Este no es el presupuesto total del viaje.</div><div class="panel table-wrap"><table class="data-table"><thead><tr><th>Concepto</th><th>Ámbito</th><th>Precio unitario</th><th>Personas / unidades</th><th>Total</th><th>Estado</th><th></th></tr></thead><tbody>${db.budget.map(b=>`<tr><td><span class="td-title">${e(b.name)}</span><span class="td-note">${e(b.note)}</span></td><td><span class="tag">${e(b.scope)}</span></td><td class="num">${eur(b.unitPrice)}</td><td class="num">${e(b.quantity)}</td><td class="num" style="font-weight:850">${eur(Number(b.quantity)*Number(b.unitPrice))}</td><td>${tag(b.status)}</td><td class="table-actions">${actions('budget',b.id)}</td>< function showPendientes(){const filtered=db.tasks.filter(t=>(filter.tasks==='Todos'||(filter.tasks==='Activos'?t.status!=='Hecho':filter.tasks===t.status))&&(filter.taskCategory==='Todas'||t.category===filter.taskCategory));const done=db.tasks.filter(t=>t.status==='Hecho').length;const pct=db.tasks.length?Math.round(done/db.tasks.length*100):0;const cats=['Todas',...new Set(db.tasks.map(t=>t.category))];const sorted=[...filtered].sort((a,b)=>({'Alta':0,'Media':1,'Baja':2}[a.priority]??2)-({'Alta':0,'Media':1,'Baja':2}[b.priority]??2));return `${pagehead('CONTROL DEL VIAJE','Pendientes','Marca tareas como hechas, añade nuevas o edita sus prioridades. Los cambios se guardan en el sistema de almacenamiento configurado.',buttonAdd('tasks','Nueva tarea'))}<div class="panel panel-body" style="margin-bottom:16px"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><b>Progreso de preparativos</b><span class="muted" style="font-size:12px">${done} de ${db.tasks.length} tareas completadas · ${pct}%</span></div><div style="height:9px;background:var(--mx-line);border-radius:20px;margin-top:11px;overflow:hidden"><div style="height:100%;width:${pct}%;background:var(--mx-turquoise);border-radius:20px"></div></div></div><div class="filterrow"><select data-filter="tasks"><option ${filter.tasks==='Activos'?'selected':''}>Activos</option><option ${filter.tasks==='Todos'?'selected':''}>Todos</option><option ${filter.tasks==='Pendiente'?'selected':''}>Pendiente</option><option ${filter.tasks==='En curso'?'selected':''}>En curso</option><option ${filter.tasks==='Hecho'?'selected':''}>Hecho</option></select><select data-filter="taskCategory" aria-label="Categoría de pendiente">${cats.map(c=>`<option ${filter.taskCategory===c?'selected':''}>${e(c)}</option>`).join('')}</select><span class="count-pill">${sorted.length} tareas</span></div><div class="panel panel-body">${sorted.map(t=>`<div class="taskline"><input class="tick" type="checkbox" ${t.status==='Hecho'?'checked':''} data-action="quick-task" data-id="${e(t.id)}" aria-label="Completar ${e(t.title)}"/><div style="flex:1;min-width:0"><b style="${t.status==='Hecho'?'text-decoration:line-through;color:#766575':''}">${e(t.title)}</b><small>${e(t.detail)}</small><div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap"><span class="tag">${e(t.category)}</span>${tag(t.priority)}${t.due?`<span class="tag">Hasta ${dateFmt(t.due)}</span>`:''}</div></div>${tag(t.status)}${actions('tasks',t.id)}</div>`).join('')}${!sorted.length?'<div class="empty">No hay tareas con estos filtros.</div>':''}</div>`}
function showPersonas(){let groups=['Laura y Peri','Amigos','Contactos'];return `${pagehead('EL EQUIPO','Participantes y contactos','Personas del viaje y contactos locales. Puedes editar sus notas y añadir a quien falte.',buttonAdd('people','Añadir persona'))}${groups.map(g=>`${sectionTitle(g)}<div class="people-grid">${db.people.filter(p=>p.group===g).map((p,i)=>`<div class="panel person"><div class="person-av">${e(p.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase())}</div><div style="flex:1;min-width:0"><div class="p-name">${e(p.name)}</div><small>${e(p.role)}</small>${p.note?`<small style="margin-top:5px">${e(p.note)}</small>`:''}</div>${actions('people',p.id)}</div>`).join('')||'<div class="empty">Sin personas en este grupo.</div>'}</div>`).join('')}`}
function showNotas(){const cats=['Todas',...new Set(db.notes.map(n=>n.category))];const notes=[...db.notes].filter(n=>filter.notes==='Todas'||n.category===filter.notes).sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0));return `${pagehead('IDEAS, DECISIONES Y PREGUNTAS','Bloc de notas','Anota propuestas, acuerdos y dudas sueltas. Las notas importantes pueden quedar fijadas arriba.',buttonAdd('notes','Nueva nota'))}<div class="filterrow"><select data-filter="notes">${cats.map(c=>`<option ${filter.notes===c?'selected':''}>${e(c)}</option>`).join('')}</select><span class="count-pill">${notes.length} notas</span></div><div class="notes-grid">${notes.map(n=>`<div class="panel note-card"><div class="note-cat">${n.pinned?'📌 · ':''}${e(n.category)}</div><h3>${e(n.title)}</h3><p>${e(n.body)}</p><div class="note-bottom"><span class="muted" style="font-size:11px">${n.pinned?'Fijada':'Nota de viaje'}</span><div style="display:flex"><button class="iconbtn" data-action="pin" data-id="${e(n.id)}" aria-label="Fijar o desfijar" title="Fijar o desfijar">${n.pinned?'📌':'♧'}</button>${actions('notes',n.id)}</div></div></div>`).join('')}</div>${!notes.length?'<div class="empty">No hay notas. Puedes añadir una nueva.</div>':''}`}

 : '<div class="panel settings-panel"><h3>💾 Modo local</h3><p>El proyecto de Supabase todavía no está vinculado. Por ahora, las modificaciones siguen guardándose solo en este navegador y no las ven otros viajeros.</p></div>';
return pagehead('DATOS Y SINCRONIZACIÓN','Datos y copias de seguridad',c.configured?'Consulta el estado compartido y conserva una copia de seguridad.':'Puedes exportar tus datos y llevarlos a otro dispositivo.')+mode+
'<div class="panel settings-panel"><h3>📋 Copias de seguridad</h3><p>Exporta el viaje a JSON para conservar una copia. El CSV incluye el itinerario y es compatible con Excel.</p><div class="settings-actions"><button class="btn btn-primary" data-action="export">↓ Descargar copia JSON</button>'+(canEdit()?'<button class="btn btn-outline" data-action="import">↑ Importar copia JSON</button>':'')+'<button class="btn btn-outline" data-action="csv">↓ Exportar itinerario CSV</button><button class="btn btn-outline" data-action="print">⎙ Imprimir</button></div></div>'+
(!c.configured?'<div class="panel settings-panel"><h3>🔄 Recuperar datos iniciales</h3><p>Esto solo afecta al navegador actual. Exporta antes una copia.</p><button class="btn btn-danger" data-action="reset">Restablecer información inicial</button></div>':'')+
'<div class="callout">🔒 <b>Privacidad:</b> el repositorio y la información compartida son públicos. No guardes pasaportes, localizadores de reservas, datos bancarios ni documentos personales. La autorización de edición se verifica en la base de datos.</div>'}
function render(){renderNav();
const c=cloud.state;
const button=$('#cloudAccount'),info=$('#cloudStatus');
if(button){button.hidden=!c.configured;button.textContent=c.user?'Salir de edición':'Acceder para editar';}
if(info)info.textContent=c.configured?(c.error?'Sin conexión':!c.ready?'Cargando…':c.editor?'Editor conectado':'Modo consulta'):'Guardado local';
if(c.configured&&!c.ready){$('#page').innerHTML='<div class="panel panel-body">Cargando datos del viaje…</div>';return;}
const banner=c.configured?(c.error?'<div class="cloud-alert">⚠️ No se ha podido leer la base de datos: '+e(c.error)+'. Se muestra una copia inicial sin posibilidad de editar.</div>':!c.docExists?'<div class="cloud-alert">☁️ El proyecto de Supabase está conectado, pero todavía no tiene datos publicados. Un editor autorizado puede inicializarlo desde «Datos y copias».</div>':(!c.editor?'<div class="cloud-alert">👀 Estás consultando el planning compartido. Para modificarlo, inicia sesión con un correo autorizado.</div>':'')):'';
const views={inicio:showInicio,itinerario:showItinerario,actividades:showActividades,presupuesto:showPresupuesto,reservas:showReservas,pendientes:showPendientes,personas:showPersonas,notas:showNotas,ajustes:showAjustes};
$('#page').innerHTML=(authNotice?'<div class="cloud-alert">⚠️ '+e(authNotice)+' <button class="btn btn-outline btn-small" data-action="login">Solicitar otro enlace</button></div>':'')+banner+(views[active]||showInicio)()+ '<div class="app-note">EXPEDICIÓN MÉXICO 2027 · Última edición: '+e(db.updated||'sin registrar')+' · '+(c.configured?(c.docExists?'Supabase · Versión '+e(c.revision):'Sin publicar'):'Guardado solo en este navegador')+'</div>';
if(c.configured&&!canEdit())document.querySelectorAll('[data-action="quick-task"],[data-action="pin"],[data-action="edit"],[data-action="delete"]').forEach(el=>{el.disabled=true;el.setAttribute('aria-disabled','true');});
}
const FIELDS={
itinerary:{label:'plan del itinerario',key:'itinerary',fields:[['date','Fecha (si está confirmada)','date'],['dateLabel','Texto de fecha opcional','text'],['title','Título','text'],['place','Lugar','text'],['region','Zona','select',['Monterrey','CDMX','Yucatán','Calakmul','Caribe']],['group','Participantes','select',['Todos','Laura y Peri','Amigos']],['status','Estado','select',['Previsto','Confirmado','Propuesto','En revisión','Por definir']],['description','Descripción','textarea'],['note','Notas / advertencias','textarea']]},
activities:{label:'actividad',key:'activities',fields:[['title','Actividad','text'],['date','Fecha prevista','date'],['location','Localización','text'],['status','Estado','select',['Investigado','Previsto','En revisión','Por definir','Por decidir','Por investigar','Reservado']],['price','Precio de referencia por persona (€)','number'],['emoji','Icono (emoji)','text'],['description','Descripción','textarea'],['details','Notas y próximos pasos','textarea'],['url','Web oficial (https://...)','url']]},
budget:{label:'gasto',key:'budget',fields:[['name','Concepto','text'],['scope','Ámbito','select',['Grupo','Pareja']],['unitPrice','Precio unitario (€)','number'],['quantity','Cantidad / personas','number'],['status','Estado','select',['Estimado','Reservado','Pagado']],['note','Notas','textarea']]},
bookings:{label:'reserva',key:'bookings',fields:[['title','Título','text'],['kind','Tipo','select',['Vuelo','Vuelo / traslado','Alquiler','Alojamiento','Otro']],['date','Fecha','date'],['status','Estado','select',['Por confirmar','Previsto','Propuesto','Reservado','Comprado','Pagado']],['travelers','Viajeros','text'],['reference','Número / referencia','text'],['url','Enlace de consulta (https://...)','url'],['description','Detalles','textarea']]},
tasks:{label:'pendiente',key:'tasks',fields:[['title','Tarea','text'],['category','Categoría','select',['Ruta y grupo','Actividades','CDMX','Vuelos y reservas','Transporte','Documentación','Monterrey','Otro']],['priority','Prioridad','select',['Alta','Media','Baja']],['status','Estado','select',['Pendiente','En curso','Hecho']],['due','Fecha límite (si la hay)','date'],['detail','Detalles','textarea']]},
people:{label:'persona',key:'people',fields:[['name','Nombre','text'],['group','Grupo','select',['Laura y Peri','Amigos','Contactos']],['role','Rol','text'],['note','Notas','textarea']]},
notes:{label:'nota',key:'notes',fields:[['title','Título','text'],['category','Categoría','select',['Organización','Decisiones','Ideas','Preguntas','Otra']],['body','Contenido','textarea'],['pinned','Fijar nota','checkbox']]}
};
function makeId(key){return key[0]+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function openEditor(type,id){if(!canEdit()){toast('Accede con un correo autorizado para editar');return}const config=FIELDS[type];if(!config)return;const current=id?db[config.key].find(x=>x.id===id):null;const obj=current||{};const fields=config.fields.map(([name,label,kind,options])=>{const val=obj[name]??'';let inp='';if(kind==='select')inp=`<select name="${name}" id="field_${name}" class="form-control">${options.map(v=>`<option value="${e(v)}" ${val===v?'selected':''}>${e(v)}</option>`).join('')}</select>`;else if(kind==='textarea')inp=`<textarea class="form-control" name="${name}" id="field_${name}" rows="3">${e(val)}</textarea>`;else if(kind==='checkbox')inp=`<input type="checkbox" name="${name}" id="field_${name}" ${val?'checked':''} style="width:20px;height:20px;accent-color:var(--mx-turquoise-dark)">`;else inp=`<input class="form-control" type="${kind}" ${kind==='number'?'step="any" min="0"':''} name="${name}" id="field_${name}" value="${e(val)}" ${['title','name'].includes(name)?'required':''}/>`;return `<div class="form-field ${kind==='textarea'?'full':''}"><label for="field_${name}">${e(label)}</label>${inp}</div>`}).join('');$('#modalRoot').innerHTML=`<div class="modal-backdrop" id="editorBackdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><div><div class="eyebrow">${current?'EDITAR':'NUEVO'}</div><h2 id="modalTitle">${current?'Editar':'Añadir'} ${e(config.label)}</h2></div><button class="iconbtn" data-action="close-modal" aria-label="Cerrar">✕</button></div><form id="editForm" data-type="${type}" data-id="${id||''}"><div class="modal-body"><div class="form-grid">${fields}</div></div><div class="modal-foot"><div>${current?`<button type="button" class="btn btn-danger btn-small" data-action="delete" data-type="${type}" data-id="${e(id)}">Eliminar</button>`:''}</div><div><button class="btn btn-outline" type="button" data-action="close-modal">Cancelar</button><button class="btn btn-primary" type="submit">Guardar cambios</button></div></div></form></section></div>`;const first=$('#editForm [name=title]')||$('#editForm [name=name]');first?.focus();}
function closeModal(){$('#modalRoot').innerHTML=''}
async function saveForm(form){const type=form.dataset.type,config=FIELDS[type],id=form.dataset.id;
const values={};for(const [key,label,kind] of config.fields){const el=form.elements.namedItem(key);if(!el)continue;values[key]=kind==='checkbox'?el.checked:kind==='number'?(el.value===''?null:Number(el.value)):el.value.trim();}
const ok=await commitMutation(next=>{let item=id?next[type].find(x=>x.id===id):null;if(!item){item={id:makeId(type)};next[type].push(item)}Object.assign(item,values);if(type==='activities'&&!Array.isArray(item.packages))item.packages=[];});
if(ok)closeModal();
}
function loginDialog(){if(!cloud.state.configured)return;
$('#modalRoot').innerHTML='<div class="modal-backdrop" id="editorBackdrop"><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>Acceder para editar</h2><button class="iconbtn" data-action="close-modal">✕</button></div><form id="loginForm"><div class="modal-body"><p class="muted">Introduce un correo autorizado. Supabase te enviará un enlace para iniciar sesión.</p><label for="loginEmail">Correo electrónico</label><input class="form-control" type="email" id="loginEmail" name="email" required autocomplete="email"/></div><div class="modal-foot"><button class="btn btn-primary" type="submit">Enviar enlace</button></div></form></section></div>';$('#loginEmail').focus();
}
function toast(msg){$('#toastRoot').innerHTML=`<div class="toast">${e(msg)}</div>`;setTimeout(()=>{$('#toastRoot').innerHTML=''},2700)}
function download(content,name,mime){const blob=new Blob([content],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200)}
function backup(){download(JSON.stringify(db,null,2),'mexico_2027_copia.json','application/json;charset=utf-8');toast('Copia de seguridad descargada')}
function csv(){const headers=['Fecha','Actividad','Lugar','Zona','Participantes','Estado','Descripcion','Notas'];const rows=[headers,...db.itinerary.map(i=>[i.dateLabel||i.date,i.title,i.place,i.region,i.group,i.status,i.description,i.note])];const lines=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');download('\uFEFF'+lines,'mexico_2027_itinerario.csv','text/csv;charset=utf-8');toast('Itinerario CSV descargado')}
async function importFile(file){if(!file)return;try{const d=JSON.parse(await file.text());const keys=['itinerary','activities','budget','bookings','tasks','people','notes'];
if(d.version!==1||!keys.every(k=>Array.isArray(d[k])))throw Error('Formato incorrecto');
if(!canEdit())throw Error('No tienes permiso para importar datos compartidos.');
if(!confirm('¿Sustituir toda la información actual por este JSON? Haz antes una copia de seguridad.'))return;
await commitMutation(next=>{for(const key of Object.keys(next))delete next[key];Object.assign(next,clone(d))},'Copia JSON importada');
}catch(err){alert('No se pudo importar: '+cloud.explain(err));}finally{$('#importFile').value='';}}
function searchModal(){let all=[...db.itinerary.map(x=>({...x,section:'itinerario',label:'Itinerario',body:x.description+' '+x.note})),...db.tasks.map(x=>({...x,section:'pendientes',label:'Pendiente',body:x.detail})),...db.notes.map(x=>({...x,section:'notas',label:'Nota',body:x.body})),...db.activities.map(x=>({...x,section:'actividades',label:'Actividad',body:x.description+' '+x.details})),...db.bookings.map(x=>({...x,section:'reservas',label:'Reserva',body:x.description}))];$('#modalRoot').innerHTML=`<div class="modal-backdrop" id="editorBackdrop"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>Buscar en el viaje</h2><button class="iconbtn" data-action="close-modal">✕</button></div><div class="modal-body"><input type="search" id="globalQuery" class="form-control" placeholder="Calakmul, vuelo, globo, pendientes…" autocomplete="off"/><div id="globalResults" style="margin-top:17px;max-height:55vh;overflow:auto"></div></div></div></div>`;function lookup(q){const term=q.toLowerCase().trim();const matches=term?all.filter(x=>((x.title||x.name||'')+' '+(x.body||'')+' '+(x.place||'')).toLowerCase().includes(term)).slice(0,14):[];$('#globalResults').innerHTML=term?(matches.length?matches.map(x=>`<button style="display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid #edf1e9;padding:11px" data-nav="${x.section}"><span class="tag">${x.label}</span><b style="display:block;margin:6px 0">${e(x.title||x.name)}</b><span class="muted" style="font-size:11px">${e((x.body||'').slice(0,100))}</span></button>`).join(''):'<div class="empty">Sin resultados para esta búsqueda.</div>'):'<div class="muted" style="font-size:12px">Escribe el nombre de una actividad, destino, nota o pendiente.</div>'}$('#globalQuery').addEventListener('input',ev=>lookup(ev.target.value));$('#globalQuery').focus();lookup('');}
document.addEventListener('click',async ev=>{
const nav=ev.target.closest('[data-nav]');if(nav){ev.preventDefault();closeModal();navGo(nav.dataset.nav);return}
const el=ev.target.closest('[data-action]');if(!el)return;const action=el.dataset.action,id=el.dataset.id,type=el.dataset.type;
if(action==='edit')openEditor(type,id);
else if(action==='close-modal')closeModal();
else if(action==='delete'){if(confirm('¿Eliminar este elemento?')){const ok=await commitMutation(next=>{next[type]=next[type].filter(x=>x.id!==id)},'Elemento eliminado');if(ok)closeModal();}}
else if(action==='quick-task'){await commitMutation(next=>{const t=next.tasks.find(x=>x.id===id);if(t)t.status=el.checked?'Hecho':'Pendiente'},'Estado de la tarea actualizado');}
else if(action==='pin'){await commitMutation(next=>{const n=next.notes.find(x=>x.id===id);if(n)n.pinned=!n.pinned},'Nota actualizada');}
else if(action==='login'){if(cloud.state.user){try{await cloud.signOut();toast('Sesión cerrada')}catch(error){alert(cloud.explain(error))}}else loginDialog();}
else if(action==='init-cloud'){
 if(!cloud.state.editor||cloud.state.docExists)return;
 if(confirm('¿Publicar el itinerario inicial en la base de datos compartida? Podrás modificarlo después.')){
 try{await cloud.publishStarter(clone(STARTER));db=clone(cloud.state.data);render();toast('Planning inicial publicado')}catch(error){alert('No se pudo inicializar: '+cloud.explain(error));}
 }}
else if(action==='export')backup();
else if(action==='import'){if(canEdit())$('#importFile').click()}
else if(action==='csv')csv();
else if(action==='print')window.print();
else if(action==='reset'){if(!cloud.state.configured && confirm('¿Restablecer los datos de este navegador?')){db=clone(STARTER);saveLocal();render();toast('Información inicial restablecida')}}
else if(action==='menu'){$('#sidebar').classList.toggle('open');$('#mobileShade').classList.toggle('show')}
else if(action==='search')searchModal();
});
document.addEventListener('submit',async ev=>{
if(ev.target.id==='editForm'){ev.preventDefault();await saveForm(ev.target);}
if(ev.target.id==='loginForm'){ev.preventDefault();const email=ev.target.elements.namedItem('email').value;
try{await cloud.emailSignIn(email);closeModal();toast('Revisa tu correo: te hemos enviado un enlace para acceder.');}
catch(error){alert('No se pudo enviar el enlace: '+cloud.explain(error));}}
});
document.addEventListener('change',ev=>{const f=ev.target.dataset.filter;if(f){filter[f]=ev.target.value;render();}});
$('#importFile').addEventListener('change',ev=>importFile(ev.target.files[0]));
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeModal();if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='k'){ev.preventDefault();searchModal();}});
document.addEventListener('click',ev=>{if(ev.target?.id==='editorBackdrop')closeModal();});
cloud.onChange(state=>{
 if(state.user)authNotice='';
 if(state.configured&&state.ready){db=clone(state.data||STARTER);}
 if(!document.getElementById('editForm')&&!document.getElementById('loginForm'))render();
});
active=(location.hash||'#inicio').slice(1);if(!NAV.some(n=>n[0]===active))active='inicio';render();
void cloud.init();
</script>
</body>
